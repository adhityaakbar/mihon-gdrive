name: Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code format (Spotless)
        run: ./gradlew spotlessCheck
        continue-on-error: true

      - name: Build Android APK
        run: ./gradlew assembleRelease -Pdist=ci

      - name: Prepare APKs for distribution
        id: prepare_apks
        run: |
          mkdir -p build_output/apk
          
          # Copy and standardize APK names
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk")
              clean_name=$(echo "$base" | sed 's/app-/mihon-/' | sed 's/-release//')
              cp "$apk" "build_output/apk/$clean_name"
              echo "Prepared $clean_name from $base"
            fi
          done
          
          echo "=== List of generated APKs ==="
          ls -lh build_output/apk/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihon-apks-${{ github.sha }}
          path: build_output/apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Preview / Tagged)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Preview Build' }}
          body: |
            Automated CI build from commit `${{ github.sha }}`.

            ### Download APK:
            - **Universal** (Semua perangkat): [`mihon-universal.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}/mihon-universal.apk)
            - **ARM64-v8a** (HP modern 64-bit): [`mihon-arm64-v8a.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}/mihon-arm64-v8a.apk)
            - **ARMeabi-v7a** (HP 32-bit): [`mihon-armeabi-v7a.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}/mihon-armeabi-v7a.apk)
            - **x86_64** (Emulator Android di PC/Mac): [`mihon-x86_64.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}/mihon-x86_64.apk)
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build_output/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
